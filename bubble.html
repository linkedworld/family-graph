<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>버블 가계도</title>

<noscript><meta http-equiv="refresh" content="0; url=index.html"></noscript>
</head>
<body style="background:#04060c;color:#93a3bb;font-family:sans-serif">
<p><a href="index.html" style="color:#6fe6ff">버블 가계도로 이동</a></p>
</body>
</html>
